#file: noinspection YAMLSchemaValidation
spring:
  application:
    name: scb-backend

  profiles:
    active: ${PROFILE:prod}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
      file-size-threshold: 2KB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.gmail.com

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

jwt:
  signer-key: ${JWT_SECRET}
  access-expiration: 900000       # 15 minutes
  refresh-expiration: 604800000   # 7 days
  register-expiration: 1800000    # 30 minutes

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

payment:
  vnpay:
    tmn-code: ${VNPAY_CODE}
    secret-key: ${VNPAY_SECRET_KEY}
    init-payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: http://localhost:8080/api/v1/payment/vnpay/return
    ipn-url: http://localhost:8080/api/v1/payment/vnpay/ipn
    timeout: 60  # Increased to 60 minutes to allow sufficient time for payment

app:
  master-data:
    enabled: true
    admin:
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      full-name: System Administrator

  async:
    email:
      core-pool-size: 5
      max-pool-size: 20
      queue-capacity: 100
      keep-alive-seconds: 60